{% extends "base.html" %}

{% block titulo %}Registrar presença - Núcleos Cariocas{% endblock %}

{% block conteudo %}
<section class="cartao">
    <h1>Registrar presença</h1>

    <form action="{{ url_for('cadastrar_presenca') }}" method="POST">
        <label for="cpfAluno">Cpf do(a) aluno(a):</label>
        <input type="text" id="cpfAluno" name="cpfAluno" required>

        <label for="idAula">Aula (código):</label>
        <input type="text" id="idAula" name="idAula" required>

        <button type="submit">Registrar</button>
    </form>
</section>
{% endblock %}
