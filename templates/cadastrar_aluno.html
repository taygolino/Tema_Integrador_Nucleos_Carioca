{% extends "base.html" %}

{% block titulo %}Cadastrar Alunos - Núcleos Cariocas{% endblock %}

{% block conteudo %}
<section class="cartao">
    <h1>Cadastrar Alunos</h1>

    <form action="/alunos/cadastrar" method="POST">
        <label for="cpf">Cpf:</label>
        <input type="text" id="cpf" name="cpf" required>

        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" required>

        <label for="telefone">Telefone:</label>
        <input type="text" id="telefone" name="telefone" required>

        <label for="endereco">Endereço:</label>
        <input type="text" id="endereco" name="endereco">

        <label for="nascimento">Data de nascimento:</label>
        <input type="text" id="nascimento" name="nascimento">

        <label for="peso">Peso:</label>
        <input type="text" id="peso" name="peso">

        <label for="altura">Altura:</label>
        <input type="text" id="altura" name="altura">

        <label for="sexo">Sexo:</label>
        <input type="text" id="sexo" name="sexo">

        <label for="idTurma">Turma:</label>
        <input type="text" id="idTurma" name="idTurma">

        <label for="senha">Defina sua senha:</label>
        <input type="password" id="senha" name="senha" required>

        <button type="submit">Cadastrar</button>
    </form>
</section>
{% endblock %}
